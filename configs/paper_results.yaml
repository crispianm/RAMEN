items:
  # ---------------- main tables, FT-ONLY comparison (commit I, Addendum 38/38a; Auditor AUD-FTONLY-S0) ----------------
  # Rows: RAMEN n46-48 vs seed-matched Metric-VDA-S FT n46-48, raw and +TAG, each as a per-seed row AND as an UNWEIGHTED 3-seed mean row (seed_mean). Released Metric-VDA-S / VDA-L / DAv2-S / DA-AC / DepthCrafter are
  # REMOVED from every comparison item (their model ids stay registered only for items that are not comparisons: tab:p1, tab:latency, fig:*, init statements). No unit in these items is new: they share the
  # J1 (tab:rep) / J5 (tab:rep_night) units; kitti_minus_0047 is derived from kitti per-clip exactly as in J2/J3. The seed-45 rows (earlier_s45) are gone from the main tables.
  # The superseded released-VDA forms of tab:dynamic/static/dynamic_night/static_diag/clean (J2/J3/J4/J8) stay valid only as released archives; their configs are in the commit paper-repro-H (a1493364).
  tab:dynamic:
    kind: bench
    title: "Dynamic low-light (llvar): RAMEN n46-48 vs seed-matched fine-tuned Metric-VDA-S n46-48, 3-seed means"
    paper_ref: "tab:dynamic"
    models: [ramen_n46, ramen_n46_tag, ramen_n47, ramen_n47_tag, ramen_n48, ramen_n48_tag, ft_n46, ft_n46_tag, ft_n47, ft_n47_tag, ft_n48, ft_n48_tag]
    datasets: [kitti, kitti_minus_0047, bonn, scannetpp, nyuv2, sintel_rgbfix]
    cells: [llvar]
    split: all
    temporal: true
    metrics: [tae_gtvalid, abs_rel_unaligned, abs_rel_aligned, delta1_aligned, tof_native, psnr_native, ssim_native]   # as the released-VDA form (fields in video_macro)
    aggregation: {per_dataset: macro}
    seed_mean: &seed_means
      - {name: "RAMEN (3-seed mean)", members: [ramen_n46, ramen_n47, ramen_n48]}
      - {name: "RAMEN + TAG (3-seed mean)", members: [ramen_n46_tag, ramen_n47_tag, ramen_n48_tag]}
      - {name: "Metric-VDA-S FT (3-seed mean)", members: [ft_n46, ft_n47, ft_n48]}
      - {name: "Metric-VDA-S FT + TAG (3-seed mean)", members: [ft_n46_tag, ft_n47_tag, ft_n48_tag]}
    seeds: {degradation: "llvar: same pinned draws as every other table (llvar_draws_<ds>.json); training seeds 46/47/48 (from scratch, 12k), RAMEN seed n matched to FT seed n"}
    reference: results_v3/c3rep_s12          # released GH200 read of the same checkpoints (kitti_minus_0047 derived as in the released reads)
    label: "exposed exploratory; one host (GH200), scorer 368b5c53; 3-seed mean = unweighted mean of the three per-seed dataset values; the comparator is the fine-tuned Metric-VDA-S of the same seed (initialised from the released Metric-VDA-S weights, same data and recipe), not the released model"
  tab:dynamic_night:
    kind: night
    title: "nuScenes-night real low light (dynamic table, last column): RAMEN n46-48 vs seed-matched FT n46-48, 3-seed means"
    paper_ref: "tab:dynamic"
    models: [ramen_n46, ramen_n46_tag, ramen_n47, ramen_n47_tag, ramen_n48, ramen_n48_tag, ft_n46, ft_n46_tag, ft_n47, ft_n47_tag, ft_n48, ft_n48_tag]
    datasets: [nuscenes_night_test]
    cells: [real]
    split: test
    temporal: true
    metrics: [tae_gtvalid, abs_rel_unaligned, abs_rel_aligned, delta1_aligned]       # no PSNR/tOF/flicker for real frames
    aggregation: {per_dataset: macro}
    seed_mean: *seed_means
    seeds: {degradation: "none (real frames)"}
    reference: results_v3/c3rep_s12
    label: "exposed exploratory; real night driving; 3-seed mean = unweighted mean of the three per-seed values"
  tab:static:
    kind: bench
    title: "Static low-light (st_llvar): RAMEN n46-48 vs seed-matched FT n46-48, 3-seed means"
    paper_ref: "tab:static"
    models: [ramen_n46, ramen_n46_tag, ramen_n47, ramen_n47_tag, ramen_n48, ramen_n48_tag, ft_n46, ft_n46_tag, ft_n47, ft_n47_tag, ft_n48, ft_n48_tag]
    datasets: [kitti, kitti_minus_0047, bonn, scannetpp, nyuv2, sintel_rgbfix]
    cells: [st_llvar]
    split: all
    temporal: true                           # = tab:rep (same unit key, so these items add NO new unit); the temporal flag only adds tae/tof fields, the static columns below are unchanged by it
    metrics: [flicker, abs_rel_unaligned, abs_rel_aligned, delta1_aligned, abs_rel_static]
    aggregation: {per_dataset: macro}
    seed_mean: *seed_means
    seeds: {degradation: "st_llvar: ONE repeated middle frame x64, per-frame noise and gain jitter (kappa x U[0.5,1.5], EV +-0.15), blur llb3; noise_seed(ds,key,'st_llvar') [bench_joint.py]"}
    reference: results_v3/c3rep_s12
    label: "exposed exploratory; 3-seed mean = unweighted mean of the three per-seed dataset values; comparator = seed-matched fine-tuned Metric-VDA-S. Must read CURRENT aggregation (static-bench 82eb6b2 is a DIFFERENT protocol, not used)"

  # ---------------- pre-declared NEW items ----------------
  tab:clean:
    kind: bench
    host: gh200                              # Addendum 30: all numbers from the GH200
    previous_host: "4090"                    # informational (planner delta vs freeze draft v1)
    title: "Clean-frame check (b0s0), development clips: RAMEN (seed 45) next to Metric-VDA-S FT (seed 46), DESCRIPTIVE"
    paper_ref: "tab:clean"
    models: [earlier_s45, earlier_s45_tag, ft_n46]                  # released Metric-VDA-S REMOVED (Add.38a); RAMEN row = seed 45 (caption says so); ft_n46 labelled "Metric-VDA-S FT (seed 46)"
    datasets: [kitti, bonn, scannetpp]                          # DEV: KITTI 7 / Bonn 13 / ScanNet++ 31 clips
    cells: [b0s0]                            # bench_joint CELLS[0] = blur 0 x AWGN 0 (no degradation, no draws)
    split: dev
    temporal: true                           # TAE (gtvalid) + tOF
    metrics: [abs_rel_aligned, abs_rel_unaligned, delta1_aligned, tae_gtvalid, tof]
    aggregation: {per_dataset: macro}
    seeds: {degradation: "none (b0s0 = no blur, no noise)"}
    reference: null                          # no released clean read exists: regenerate-only, no --verify
    # NO `reading:` block. The pre-declared non-inferiority verdict (Auditor R1 ruling 4) was against the RELEASED Metric-VDA-S; the FT n46 clean values were already known (J8) when the reference
    # was changed to ft_n46, so a verdict against FT would not be pre-declared. Auditor AUD-FTONLY-S0 item 4 (option 1): the table is DESCRIPTIVE, no verdict column and no verdict sentence.
    label: "development clips (seen during development); GH200; regenerate-only; DESCRIPTIVE: no verdict, no pass/fail sentence (the comparator was chosen after its values were known). RAMEN = seed 45; comparator row 'Metric-VDA-S FT (seed 46)' (a different seed)"
  tab:static_diag:
    kind: bench
    host: gh200                              # = the host of tab:static, so each st_llvar unit is scored ONCE on ONE host (units shared with tab:static)
    title: "Alignment-invariant static flicker diagnostic eps_d: RAMEN n46-48 vs seed-matched FT n46-48 (same units as tab:static)"
    paper_ref: "tab:static_diag"
    models: [ramen_n46, ramen_n46_tag, ramen_n47, ramen_n47_tag, ramen_n48, ramen_n48_tag, ft_n46, ft_n46_tag, ft_n47, ft_n47_tag, ft_n48, ft_n48_tag]
    datasets: [kitti, kitti_minus_0047, bonn, scannetpp, nyuv2, sintel_rgbfix]
    cells: [st_llvar]
    split: all
    temporal: true                           # = tab:static / tab:rep (shared units)
    metrics: [eps_d, flicker]                # eps_d = per-clip-affine aligned depth-error frame difference over Omega (bench_joint.py @368b5c53)
    aggregation: {per_dataset: macro}
    seed_mean: *seed_means
    seeds: {degradation: "same units as tab:static (dedupes with it)"}
    reference: results_v3/c3rep_s12
    reading:                                 # eps_d sign rule (Auditor R1 ruling 5), RE-DECLARED for the FT-only rows (Auditor AUD-FTONLY-S0 item 4: mechanical, descriptive, post hoc)
      kind: eps_d_every_dataset
      metric: eps_d
      disclosure: "eps_d is a diagnostic chosen after the main results, and this reading was re-declared for the fine-tuned-comparator rows after their eps_d values were already available (J1); it is descriptive and post hoc, not pre-registered. Never the paper's flicker metric. A pair statement reads 'X flickers more than Y by the alignment-invariant diagnostic eps_d' only if X's eps_d exceeds Y's on every dataset shown; otherwise 'mixed'. The paper uses the rows of the 3-seed means (the per-seed pairs are listed for completeness)."
    label: "exposed exploratory; descriptive and post hoc. 'X flickers more than Y' only if X's eps_d exceeds Y's on every dataset shown, stated 'by the alignment-invariant diagnostic eps_d'; otherwise 'mixed'. eps_d is a diagnostic chosen after the main results; comparator = seed-matched fine-tuned Metric-VDA-S."

  # ---------------- replication, fidelity, P1, latency ----------------
  tab:rep:
    kind: bench
    title: "Three-seed replication: RAMEN (n46-48) vs seed-matched FT, llvar + st_llvar"
    paper_ref: "tab:rep"
    models: [ramen_n46, ramen_n46_tag, ramen_n47, ramen_n47_tag, ramen_n48, ramen_n48_tag, ft_n46, ft_n46_tag, ft_n47, ft_n47_tag, ft_n48, ft_n48_tag]
    datasets: [kitti, bonn, scannetpp, nyuv2, sintel_rgbfix]
    cells: [llvar, st_llvar]
    split: all
    temporal: true
