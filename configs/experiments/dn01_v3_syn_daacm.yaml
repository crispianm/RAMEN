# DN-01 protocol v3 WP23: DA-AC baseline (metric), per-frame, fine-tuned on OUR degraded data under the SAME loop/loss/steps/LR as ours (WP20). Same scope as the DA-V2-S rows
# (frozen DINOv2, trainable DPT head, no temporal/restorer); init = released DA-AC (degraded-trained relative disparity). DRAFT: data block = the a1h SYN placeholder until WP11 (see dn01_v3_syn_dav2a.yaml).
# metric: the head read as metres, loss = VDA metric stage (SiLog), predicts_disparity false.
model:
  arch: daac
  vda_repo: /projects/b5dh/repos/Video-Depth-Anything
  metric: true
  device: cuda
  daac_repo: /projects/b5dh/benchmark/competition/DepthAnythingAC
  daac_checkpoint_path: /projects/b5dh/benchmark/weights/depth_anything_AC_vits.pth
  daac_init: released
  daac_variant: metric
data:
  sources:
  - resize_mode: vda
    type: tartanair
    root: /projects/b5dh/data/train/tartanair
    sampling_mass: 310000
    metric_supervision: false
    sparse_gt: false
  - resize_mode: vda
    type: vkitti
    root: /projects/b5dh/data/train/vkitti
    variants:
    - clone
    - fog
    - morning
    - overcast
    - rain
    - sunset
    - 15-deg-left
    - 15-deg-right
    - 30-deg-left
    - 30-deg-right
    cameras:
    - Camera_0
    - Camera_1
    no_holdout: true
    vkitti_max_depth: 80
    sampling_mass: 40000
    metric_supervision: true
    sparse_gt: false
  - resize_mode: vda
    type: pointodyssey
    root: /projects/b5dh/data/train/point_odyssey/train
    po_keep_list: provenance/dn01_vdamix/po_filter_v1.json
    po_keep_sha256: ff4851c6ad1d8bb0754ef9ef30aeb1c83562624041074acd41e41b5e9eedb34c
    sampling_mass: 87206
    metric_supervision: false
    sparse_gt: false
  - resize_mode: vda
    type: pointodyssey
    root: /projects/b5dh/data/train/point_odyssey/val
    po_keep_list: provenance/dn01_v3/po_filter_val_v1.json
    po_keep_sha256: 65c0900e22c8681e97aec0f063a955cffaf05dec24d45c0a6ab66ab0568839a3
    sampling_mass: 12794
    metric_supervision: false
    sparse_gt: false
  - resize_mode: vda
    type: irs
    root: /projects/b5dh/data/train/irs
    val_fraction: 0.0
    sampling_mass: 100000
    metric_supervision: true
    sparse_gt: false
  - resize_mode: vda
    type: spring
    root: /projects/b5dh/data/train/spring
    val_fraction: 0.03
    sampling_mass: 4843
    metric_supervision: false
    sparse_gt: false
    max_depth: 80.0
  val_sources:
  - resize_mode: vda
    type: spring
    root: /projects/b5dh/data/train/spring
    val_fraction: 0.03
  uniform_sampler: true
  val_clips_per_source: 20
  num_frames: 32
  image_size:
  - 518
  - 518
  clip_stride: 32
  frame_stride: 1
  max_depth: 80.0
  max_clips_per_video: null
  seed: 45
  degrade: true
  degrade_mode:
  - awgn_blur
  - lowlight
  val_degrade_severity: null
  num_workers: 8
  val_batch_size: 1
  clean_prob: 0.2
  seeded_noise: true
  blur_only_prob: 0.5
  lowlight:
    ev:
    - -3.0
    - -0.5
    kappa: 0.186
    target: exposed
  static_prob: 0.25
  static_noise_mult:
  - 0.5
  - 1.5
  static_ev_jitter: 0.15
  split_seed: 43
  sampling: mass
training:
  max_epochs: 1000
  max_steps: 12000
  batch_size: 1
  grad_accum: 4
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_steps: 500
  lr_decay_steps: 12000
  grad_clip: 1.0
  precision: bf16
  ema_decay: 0.0
  severity_warmup_steps: 500
  severity_max_cap: 1.0
  val_every_steps: 2000
  checkpoint_every_steps: 500
  val_max_batches: 80
  checkpoint_dir: runs/dn01_v3_syn_daacm
  checkpoint_at_steps:
  - 100
  - 250
  - 500
  - 1000
  - 2000
  - 4000
  - 6000
  - 8000
  - 12000
  grad_clip_per_group: true
  severity_hold_steps: 0
  severity_warmup_start: 0.0
  seed_scheme: x1000
loss:
  ssi_weight: 1.0
  ssi_align: perclip
  tgm_weight: 10.0
  gradient_weight: 0.5
  silog_weight: 0.0
  metric_weight: 0.0
  distill_weight: 0.0
  consistency_weight: 0.0
  gram_weight: 0.0
  sky_zero_disparity: false
  loss_mode: vda
  ssi_scales: 4
  ssi_trim: 0.0
  metric_silog_weight: 1.0
  metric_silog_lambda: 0.5
  metric_depth_clamp:
  - 0.1
  - 100000.0
  sky_hinge_weight: 0.1
  log_terms: true
eval:
  outdoor_monitor:
    root: /projects/b5dh/data/train/vkitti
    every_steps: 100
    clips: 4
    variants:
    - clone
    - overcast
    cameras:
    - Camera_0
    clean_too: true
