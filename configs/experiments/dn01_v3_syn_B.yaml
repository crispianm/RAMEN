extends: dn01_v3_headc_b_a1h.yaml

# DN-01 protocol v3 WP20 arm B: design-(c) coupling (c2: st_inject false, st_depth_input restored, st_stage2_width wide2x, gate_lr_scale 10; WP17) on the a1h base. Step-0 depth == A's base depth.
# SHARED v3 keys (identical in A / B; Benh0 and TAE inherit them):
#  - data: = configs/data/dn01_v3_syn.yaml (WP11, SYN) verbatim, EXCEPT data.lowlight.ev = [-3.0, -0.5] (llvar EV ~ U[-3, -0.5], PROTOCOL_TABLE s1).
#    GAP (llvar): the training degrader has NO per-clip kappa multiplier {0.5, 1, 2} (data.lowlight.kappa is one scalar, 0.186 = the x1 case), nor llvar's pinned blur draw; the a1h degradation (awgn_blur + lowlight, blur_only_prob 0.5, static_prob 0.25) is
#    kept otherwise. Closing it needs a train-side kappa-mult key (code change, not done here). clean_prob 0.2 (the a1h value). Rain: the VKITTI `rain` variant is in the WP11 mix; no further training key exists or is needed.
#  - training: max_steps 12000, lr_decay_steps = max_steps (12000), checkpoint_at_steps as WP21's mvdas_ft (same schedule => a diff vs WP21 shows only restorer keys).
#  - TODO(WP19 winner keys): sky floor / FIX-A / FIX-B recipe keys go HERE once WP19 names them (RESCORE_SUMMARY.csv). Not invented; none are set.
data:
  sources:
  - resize_mode: vda
    type: tartanair
    root: /projects/b5dh/data/train/tartanair
    sampling_mass: 310000
    metric_supervision: false
    sparse_gt: false
  - resize_mode: vda
    type: vkitti
    root: /projects/b5dh/data/train/vkitti
    variants:
    - clone
    - fog
    - morning
    - overcast
    - rain
    - sunset
    - 15-deg-left
    - 15-deg-right
    - 30-deg-left
    - 30-deg-right
    cameras:
    - Camera_0
    - Camera_1
    no_holdout: true
    vkitti_max_depth: 80
    sampling_mass: 40000
    metric_supervision: true
    sparse_gt: false
  - resize_mode: vda
    type: pointodyssey
    root: /projects/b5dh/data/train/point_odyssey/train
    po_keep_list: provenance/dn01_vdamix/po_filter_v1.json
    po_keep_sha256: ff4851c6ad1d8bb0754ef9ef30aeb1c83562624041074acd41e41b5e9eedb34c
    sampling_mass: 87206
    metric_supervision: false
    sparse_gt: false
  - resize_mode: vda
    type: pointodyssey
    root: /projects/b5dh/data/train/point_odyssey/val
    po_keep_list: provenance/dn01_v3/po_filter_val_v1.json
    po_keep_sha256: 65c0900e22c8681e97aec0f063a955cffaf05dec24d45c0a6ab66ab0568839a3
    sampling_mass: 12794
    metric_supervision: false
    sparse_gt: false
  - resize_mode: vda
    type: irs
    root: /projects/b5dh/data/train/irs
    val_fraction: 0.0
    sampling_mass: 100000
    metric_supervision: true
    sparse_gt: false
  - resize_mode: vda
    type: spring
    root: /projects/b5dh/data/train/spring
    val_fraction: 0.03
    sampling_mass: 4843
    metric_supervision: false
    sparse_gt: false
    max_depth: 80.0
  val_sources:
  - resize_mode: vda
    type: spring
    root: /projects/b5dh/data/train/spring
    val_fraction: 0.03
  uniform_sampler: true
  val_clips_per_source: 20
  num_frames: 32
  image_size:
  - 518
  - 518
  clip_stride: 32
  frame_stride: 1
  max_depth: 80.0
  max_clips_per_video: null
  seed: 45
  degrade: true
  degrade_mode:
  - awgn_blur
  - lowlight
  val_degrade_severity: null
  num_workers: 8
  val_batch_size: 1
  clean_prob: 0.2
  seeded_noise: true
  blur_only_prob: 0.5
  lowlight:
    ev:
    - -3.0
    - -0.5
    kappa: 0.186
    target: exposed
  static_prob: 0.25
  static_noise_mult:
  - 0.5
  - 1.5
  static_ev_jitter: 0.15
  split_seed: 43
  sampling: mass
training:
  max_steps: 12000
  lr_decay_steps: 12000
  checkpoint_at_steps: [100, 250, 500, 1000, 2000, 4000, 6000, 8000, 12000]
  checkpoint_dir: runs/dn01_v3_syn_B
