[project]
name = "ramen"
version = "0.1.0"
description = "RAMEN — causal degradation-robust streaming video depth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy<2",
    "opencv-python>=4.5",
    "pillow>=9",
    "pyyaml>=6",
    "einops>=0.7",
    "safetensors>=0.4",
    "omegaconf>=2.3",
    "addict>=2.4",
    "huggingface_hub>=0.24",
    "tqdm>=4",
    "ipykernel",
    "matplotlib>=3.10.9",
    "easydict>=1.13",
    "scipy>=1.17.1",
    "imageio>=2.34",
    "natsort>=8.4",
]

[project.optional-dependencies]
nuscenes = ["nuscenes-devkit>=1.1.11"]
depth_pro = ["timm>=0.9", "pillow-heif>=0.16"]

[tool.uv]
# Run-in-place project: manage the env + lockfile, don't build a wheel
# (flat top-level layout -- models/, data/, train.py -- run from the repo root via `uv run python train.py ...`).
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8",
    "ruff>=0.6",
]
